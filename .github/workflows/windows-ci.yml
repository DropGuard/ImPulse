name: windows-ci
# Windows joined the supported-platforms table (DEVELOPING.md, "Linux and
# Windows (msys2)").
#
# clang64, not ucrt64. The tree used ucrt64 because exiv2 and mpv were said to
# be packaged only there — checked on 2026-11-21 and no longer true: both are
# in clang64 (and clangarm64 and ucrt64). clang64 is the better single
# environment because it is the only one that also carries clazy, so the same
# tree that builds and tests the code can run the lint gate on it, seeing the
# branches this platform actually preprocesses.
#
# The three msys2 environments are NOT interchangeable: each has its own C/C++
# runtime ABI, and mixing their libraries produces link errors or silent
# breakage. One environment, every package from it.
#
# Deliberately NO aqtinstall: Qt 6.12 comes from the msys2 packages, so the
# job never faces the Qt-download problem the aqt-based Linux job did.
#
# Trigger policy: workflow_dispatch and pushes to the integration trunk (and
# to windows-port while that branch is still the port's workbench). The
# per-push iteration loop is the local pre-commit gate — the machine that
# owns the code runs the full build and suite set in ~2 minutes — so CI here
# is not the dev loop, it is the fresh-clone confirmation: it catches what a
# warm local tree cannot see (package-set drift in the rolling msys2 repos,
# a configure step that quietly depended on local state). The old
# msys2-test.yml (created 51278bec) predates the engine rework and was a
# stub; this job is its replacement, written from the measured local recipe.
on:
  workflow_dispatch:
  push:
    branches: [rustcore]
# A newer push makes an older run's verdict irrelevant: cancel it rather than
# let it finish behind the new one. `github.ref` keeps a tag push and a branch
# push from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-clang64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      # Rust comes from pacman, not dtolnay's action: that action writes to the
      # Windows-side PATH (~/.cargo under C:\Users\...), which an msys2 shell
      # does not read — measured, corrosion still said "rustc not found" with
      # the action's step green above it. The msys2 package puts rustc on the
      # shell's own PATH, which is the one corrosion resolves.
      - name: install the clang64 toolchain and libraries
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          release: false
          # the pacman package cache: 230s of the job was downloading and
          # unpacking the same packages on every run
          cache: true
          install: >-
            git
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-qt6-base
            mingw-w64-clang-x86_64-qt6-imageformats
            mingw-w64-clang-x86_64-qt6-svg
            mingw-w64-clang-x86_64-qt6-tools
            mingw-w64-clang-x86_64-opencv
            mingw-w64-clang-x86_64-exiv2
            mingw-w64-clang-x86_64-mpv
            mingw-w64-clang-x86_64-gtest
            mingw-w64-clang-x86_64-rust
            mingw-w64-clang-x86_64-cppcheck
            mingw-w64-clang-x86_64-clang-tools-extra
            mingw-w64-clang-x86_64-clazy
            mingw-w64-clang-x86_64-ccache
      # ccache for the compile itself; the setup-msys2 cache above covers only
      # the pacman packages. The path is msys2's own home, not the Windows one.
      - name: ccache
        uses: actions/cache@v4
        with:
          path: C:\msys64\home\runneradmin\.cache\ccache
          key: ccache-${{ runner.os }}-clang64-${{ hashFiles('.github/workflows/windows-ci.yml') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-clang64-${{ hashFiles('.github/workflows/windows-ci.yml') }}-
      # the lint gate's per-TU verdict cache (build/.lint-cache): LINT alone
      # was 378s of the suites step on this runner. Same pattern as ccache —
      # the key carries the commit, restore-keys falls back to the newest
      # cache from this workflow. lint.py hashes the TU and its depfile
      # headers into the key, so a stale restore can never answer for a file
      # that moved.
      - name: lint cache
        uses: actions/cache@v4
        with:
          path: build/.lint-cache
          key: lint-cache-${{ runner.os }}-clang64-${{ hashFiles('.github/workflows/windows-ci.yml') }}-${{ github.sha }}
          restore-keys: |
            lint-cache-${{ runner.os }}-clang64-${{ hashFiles('.github/workflows/windows-ci.yml') }}-
      - name: configure
        run: |
          ccache --set-config=max_size=2G
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLINT_TESTS=ON \
            -DEXIV2=ON -DVIDEO_SUPPORT=ON -DOPENCV_SUPPORT=ON \
            -DRust_CARGO_TARGET=x86_64-pc-windows-gnullvm \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: build (warnings are contractual — the fatal families are -Werror)
        run: cmake --build build -j"$(nproc)"
      # Everything, including the three gates. This environment carries
      # clang-format, clang-tidy, cppcheck and clazy, so the tree's checks run
      # here against the compiler that preprocesses the Windows branches —
      # which is the one thing Linux cannot do. Nothing is excluded: a gate
      # that only ever runs where the code already builds is half a gate.
      - name: the suites and the gates
        run: |
          cd build
          QT_QPA_PLATFORM=offscreen ctest -j"$(nproc)" --output-on-failure
