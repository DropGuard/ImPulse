name: ci
# The supported platforms are Linux (this pipeline — the tree it was written
# for) and Windows (windows-ci.yml, the ucrt64 recipe mirrored from the dev
# machine; the old msys2 packaging workflow predates the engine rework and
# could not build this tree again, which is why Windows CI sat out for a
# while). What CI can and should carry is the pipeline the repo already
# trusts locally — the build with its zero-warning contract, the ctest
# suites, and the Rust suite. The deep checks (the lint gate, the sanitizer
# tree, Miri) stay out of the per-push path: the gate's clazy counts are
# baseline-sensitive to the toolchain version and belong to the pre-commit
# gate on the machine that owns the baseline, and the sanitizer and
# interpreter runs pay minutes the push path does not need to pay. They run
# on the nightly schedule instead, and on demand.
on:
  push:
    branches: [rustcore]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
jobs:
  build-test:
    # The same distribution the tree is developed on. Everything below used to
    # be a workaround for running an older one: Qt from aqtinstall because
    # noble's apt Qt is 6.4, clang-format from LLVM's repo because noble ships
    # 18, and an Exiv2 0.27 that rejected API the code uses. None of that is
    # about the code — it was the runner, and this runner exists.
    #
    # The gates are also only meaningful when both sides run the same
    # instruments: clazy reads a compiler's AST, so GCC 13 and GCC 15 disagree
    # about Qt's inlined containers and report different findings for identical
    # source. Matching the distribution matches the compiler, the formatter and
    # the library versions in one move.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: system deps (Qt, OpenCV, Exiv2, mpv, GTest, the lint instruments)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build cmake file python3-venv \
            qt6-base-dev libqt6svg6-dev libgl1-mesa-dev libxkbcommon-dev \
            libopencv-dev libexiv2-dev libmpv-dev libgtest-dev \
            clang-format-21 clang-tidy-21 clazy cppcheck
          # the tree calls them by their unversioned names
          sudo ln -sf /usr/bin/clang-format-21 /usr/local/bin/clang-format
          sudo ln -sf /usr/bin/clang-tidy-21 /usr/local/bin/clang-tidy
      # LINT_TESTS=ON puts the static-analysis gate into ctest, so this job
      # runs the same four gates the pre-commit hook runs — which is the point
      # of a clean machine: the hook can be skipped with --no-verify, and it
      # skips itself when a tool is missing.
      - name: configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLINT_TESTS=ON
      - name: build (warnings are contractual — the fatal families are -Werror)
        run: cmake --build build -j$(nproc)
      - name: the suites (includes FORMAT_RULES, ARCH_RULES, LINT)
        run: cd build && QT_QPA_PLATFORM=offscreen ctest --output-on-failure
      - name: rust suite
        run: cargo test --manifest-path engine/qimgv-engine/Cargo.toml

  deep-checks:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: system deps (see the build-test job for why this runner)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build cmake file python3-venv \
            qt6-base-dev libqt6svg6-dev libgl1-mesa-dev libxkbcommon-dev \
            libopencv-dev libexiv2-dev libmpv-dev libgtest-dev \
            clang-format-21
          sudo ln -sf /usr/bin/clang-format-21 /usr/local/bin/clang-format
      - name: sanitizer tree (address,undefined — the ASan gate the local tree runs)
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DQIMGV_SANITIZERS=address,undefined
          cmake --build build-asan -j$(nproc)
          cd build-asan && QT_QPA_PLATFORM=offscreen ASAN_OPTIONS=detect_leaks=1 ctest --output-on-failure
      - name: miri over the pure layer (the armed race test must fail to pass)
        run: sh scripts/miri.sh

  appimage:
    # A self-contained Linux bundle: Qt 6.9, OpenCV, exiv2, libmpv and the
    # engine are all inside, so the user's distribution does not matter. The
    # 22.04 base is the glibc floor the bundle inherits (glibc is forward
    # compatible only) — it covers Debian 12+ and Ubuntu 22.04+.
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # only the release step below consumes this, and only a tag push reaches
      # it; job level is the finest scope GitHub offers
      contents: write
    container:
      image: ubuntu:22.04
    steps:
      - name: toolchain and build deps (the 22.04 image ships almost nothing)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git curl ca-certificates \
            build-essential cmake ninja-build file python3 python3-venv python3-pip \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb1-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libopencv-dev libexiv2-dev libmpv-dev g++-12 libgtest-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: qt 6.10.2 via aqtinstall
        run: |
          python3 -m venv /opt/aqt-venv
          /opt/aqt-venv/bin/pip install -q aqtinstall
          /opt/aqt-venv/bin/aqt install-qt linux desktop 6.10.2 linux_gcc_64 -O /opt/qt
      - name: configure and build
        env:
          CC: gcc-12
          CXX: g++-12
        run: |
          cmake -S . -B build-appimage -G Ninja -DCMAKE_BUILD_TYPE=Release \
           
          cmake --build build-appimage -j$(nproc)
      - name: assemble the AppDir
        run: |
          VERSION=$(grep -oP 'appVersion\(\K[0-9,]+' src/appversion.cpp | tr ',' '.')
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin/plugins" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/metainfo" \
                   "$APPDIR/usr/share/icons/hicolor/scalable/apps" \
                   "$APPDIR/usr/share/impulse/translations"
          cp build-appimage/src/impulse "$APPDIR/usr/bin/"
          cp build-appimage/plugins/player_mpv/player_mpv.so "$APPDIR/usr/bin/plugins/"
          cp src/distrib/impulse.desktop "$APPDIR/usr/share/applications/"
          cp src/distrib/impulse.appdata.xml "$APPDIR/usr/share/metainfo/"
          cp src/distrib/hicolor/scalable/apps/impulse.svg "$APPDIR/usr/share/icons/hicolor/scalable/apps/"
          cp build-appimage/src/translations/*.qm "$APPDIR/usr/share/impulse/translations/"
      - name: linuxdeploy with the Qt plugin deployer (one 6.10.2 world inside)
        run: |
          curl -sL --retry 5 --retry-all-errors -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sL --retry 5 --retry-all-errors -o linuxdeploy-plugin-qt.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          curl -sL --retry 5 --retry-all-errors -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage appimagetool.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          # plugin-qt drives qtpaths/qmake to deploy Qt's whole closure — the
          # dlopen'd companions (libQt6XcbQpa, libQt6WaylandClient, ...) that
          # ldd against the binary cannot see. Without them the bundled
          # platform plugins resolve those sonames from the host, and a
          # process already running 6.10.2 Core refuses an older host 6.x:
          # both xcb and wayland died "found but could not load" on a real
          # desktop whose ldconfig HAS every file. The job's PATH decides
          # which Qt gets deployed — pin it.
          export PATH="$PWD:/opt/qt/6.10.2/gcc_64/bin:$PATH"
          # plugin-qt deploys libqxcb.so and nothing else by default; the
          # wayland pair and the offscreen plugin the smoke runs under must
          # be requested explicitly or the bundle is X11-only and the smoke
          # dies with "Available platform plugins are: xcb"
          export EXTRA_PLATFORM_PLUGINS="libqwayland-egl.so;libqwayland-generic.so;libqoffscreen.so"
          ./linuxdeploy.AppImage --appdir AppDir --plugin qt
          cat AppDir/usr/bin/qt.conf
          # linuxdeploy's --exclude-library matches exact sonames only, so the
          # system-provided libraries ride the closure and are deleted here:
          # they exist on every desktop system, and bundling them drags a glibc
          # floor the 22.04 base does not provide (libsystemd needed 2.36+)
          rm -f AppDir/usr/lib/libsystemd.so* \
                AppDir/usr/lib/libgcc_s.so* \
                AppDir/usr/lib/libstdc++.so*
      - name: pack
        run: |
          VERSION=$(grep -oP 'appVersion\(\K[0-9,]+' src/appversion.cpp | tr ',' '.')
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./appimagetool.AppImage --appimage-extract-and-run AppDir "ImPulse-${VERSION}-x86_64.AppImage"
      - name: smoke (the bundle must survive a headless start)
        run: |
          QT_QPA_PLATFORM=offscreen timeout 8 ./ImPulse-*-x86_64.AppImage --appimage-extract-and-run \
            || [ $? -eq 124 ]
      - name: gh for the release step (not preinstalled inside the container image)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -sL --retry 5 --retry-all-errors \
            https://github.com/cli/cli/releases/download/v2.103.3/gh_2.103.3_linux_amd64.tar.gz \
            | tar xz --strip-components=1 -C /usr/local
          gh --version
      - name: release (a tag lands a draft — publish only after the real-machine check)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'appVersion\(\K[0-9,]+' src/appversion.cpp | tr ',' '.')
          # a tag that disagrees with the shipped version string would publish a lie
          test "v${VERSION}" = "${GITHUB_REF_NAME}" || {
              echo "tag ${GITHUB_REF_NAME} does not match appversion v${VERSION}" >&2
              exit 1
          }
          sha256sum "ImPulse-${VERSION}-x86_64.AppImage" > "ImPulse-${VERSION}-x86_64.AppImage.sha256"
          gh release create "${GITHUB_REF_NAME}" --draft --generate-notes \
            "ImPulse-${VERSION}-x86_64.AppImage" \
            "ImPulse-${VERSION}-x86_64.AppImage.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: ImPulse-*-x86_64.AppImage
