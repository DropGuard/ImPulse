[package]
name = "qimgv-engine"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "UI-agnostic directory model / scheduler core for qimgv"

[dependencies]
crossbeam-channel = { workspace = true }
slotmap = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
imagesize = { workspace = true }
kamadak-exif = { workspace = true }

# The watcher's syscall shells are platform-shaped: inotify (+libc) on Linux,
# declared kernel32 entry points on Windows (watcher/fd_windows.rs carries its
# own bounded extern block — no -sys crate, so the surface stays reviewable
# in one place and cannot grow by accident).
[target.'cfg(target_os = "linux")'.dependencies]
inotify = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
