[workspace]
resolver = "2"
members = ["engine/qimgv-engine", "engine/qimgv-engine-ffi"]

[workspace.dependencies]
crossbeam-channel = "0.5"
thiserror = "2.0"
log = "0.4"
tempfile = "3"
proptest = "1"
imagesize = "0.13"
kamadak-exif = "0.6"
inotify = "0.11"
libc = "0.2"

# The one lint that is a rule rather than a style: every `unsafe` block says why
# it is sound. Declared here so an editor's clippy and scripts/clippy.sh agree;
# each crate opts in with `[lints] workspace = true`.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
